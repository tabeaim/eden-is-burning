<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2347"/>
      <stop offset="0.42" stop-color="#3a2c4a"/>
      <stop offset="0.72" stop-color="#8a4a2a"/>
      <stop offset="0.9" stop-color="#1a120e"/>
      <stop offset="1" stop-color="#0b0a0a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.26" cy="0.74" r="0.5">
      <stop offset="0" stop-color="#f4b25a" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#e8903c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8903c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="360" fill="url(#sky)"/>

  <!-- Sterne -->
  <g fill="#eef0ff">
    <circle cx="180" cy="54" r="1.4" opacity="0.8"/>
    <circle cx="360" cy="92" r="1" opacity="0.6"/>
    <circle cx="540" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="760" cy="70" r="1" opacity="0.5"/>
    <circle cx="980" cy="46" r="1.3" opacity="0.7"/>
    <circle cx="1180" cy="84" r="1" opacity="0.55"/>
    <circle cx="1340" cy="52" r="1.4" opacity="0.75"/>
    <circle cx="1480" cy="96" r="1" opacity="0.5"/>
  </g>

  <!-- Sonnenglut am Horizont -->
  <ellipse cx="420" cy="266" rx="900" ry="150" fill="url(#sun)"/>

  <!-- ferne Skyline (Silhouette vor der Glut) -->
  <g fill="#120d10">
    <rect x="60" y="208" width="58" height="152"/>
    <rect x="124" y="170" width="40" height="190"/>
    <rect x="176" y="224" width="74" height="136"/>
    <rect x="262" y="150" width="36" height="210"/>
    <rect x="306" y="196" width="86" height="164"/>
    <rect x="404" y="232" width="60" height="128"/>
    <rect x="476" y="178" width="44" height="182"/>
    <rect x="540" y="214" width="92" height="146"/>
    <rect x="648" y="158" width="38" height="202"/>
    <rect x="700" y="222" width="80" height="138"/>
    <rect x="980" y="200" width="64" height="160"/>
    <rect x="1054" y="166" width="42" height="194"/>
    <rect x="1108" y="226" width="88" height="134"/>
    <rect x="1210" y="150" width="40" height="210"/>
    <rect x="1262" y="206" width="78" height="154"/>
    <rect x="1352" y="180" width="54" height="180"/>
    <rect x="1420" y="224" width="96" height="136"/>
  </g>

  <!-- erleuchtete Fenster -->
  <g fill="#ffcf7a">
    <rect x="138" y="186" width="6" height="10" opacity="0.85"/>
    <rect x="150" y="206" width="6" height="10" opacity="0.7"/>
    <rect x="274" y="168" width="6" height="10" opacity="0.85"/>
    <rect x="274" y="196" width="6" height="10" opacity="0.6"/>
    <rect x="488" y="196" width="6" height="10" opacity="0.8"/>
    <rect x="660" y="176" width="6" height="10" opacity="0.85"/>
    <rect x="1066" y="184" width="6" height="10" opacity="0.8"/>
    <rect x="1222" y="170" width="6" height="10" opacity="0.85"/>
    <rect x="1222" y="198" width="6" height="10" opacity="0.6"/>
    <rect x="1366" y="200" width="6" height="10" opacity="0.75"/>
